---
name: Ship
on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

env:
  DOCKER_REPO: "ghcr.io/tressims/scry"

jobs:
  scry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          fallbackTag: 0.0.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@main
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            $DOCKER_REPO:${{ steps.semver.outputs.next }}
            $DOCKER_REPO:latest
