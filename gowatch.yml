---
# gowatch.yml configuration example

# The name of the executable generated under the current directory execution.
# The default is the current directory name.
# appname: "app"

# Specify the command to run after builds done
run_cmd: "./bin/scry"

# Specify the directory where the compiled object files are stored
output: bin/scry

# The file name suffix that needs to be monitored.
# By default, there is only a '.go' file.
watch_exts:
  - .yml
  - .go
  - .so

# The directory that needs to listen for file changes.
# By default, only the current directory.
watch_paths:
  - cmd
  - config
  - plugin
  - tui
  - facts
  - bundle

# Additional parameters that need to be added when running the application
cmd_args:
  - run
  - -v=-4

# Whether to listen to file changes in the 'vendor' folder
vendor_watch: false

# Directory that do not need to listen for file changes
# excluded_paths:
#   - path

# main package path.
# can also be a single file, multiple files separated by commas
build_pkg: "."

# build tags
build_tags: ""

# Commands that can be executed before build the app
# prev_build_cmds:
#   - swag init

# Whether to prohibit automatic operation
disable_run: false

# use GOGC on build
build_go_gc: false

# log level, support debug, info, warn, error, fatal
log_level: "debug"
